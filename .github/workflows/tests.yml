name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.13'
            homeassistant: '2025.12.5'
          - python: '3.14'
            homeassistant: '2026.10.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-test.txt 'homeassistant==${{ matrix.homeassistant }}'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
